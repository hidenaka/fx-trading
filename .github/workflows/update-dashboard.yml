name: Update Dashboard

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install pandas numpy scikit-learn
    
    - name: Update portfolio data
      run: |
        cd fx_trading
        PYTHONPATH=src python3 scripts/update_dashboard_data.py
      env:
        OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN || 'dummy' }}
        OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID || 'dummy' }}
    
    - name: Copy updated data to docs
      run: |
        cp fx_trading/dashboard/data/*.json docs/dashboard/data/ 2>/dev/null || true
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/dashboard/data/
        git diff --staged --quiet || (git commit -m "auto: update dashboard data $(date -u +%Y-%m-%d_%H:%M)" && git push)
